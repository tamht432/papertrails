<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bức thư qua rừng bông lao</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #2a1a12; }
      body { display: grid; place-items: center; }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #96744a;
      }
      #render-surface, #titles {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #render-surface { display: block; }
      #titles {
        z-index: 3;
        color: #fff3dc;
        font-family: Georgia, "Times New Roman", serif;
        pointer-events: none;
      }
      .title, .subtitle, .ending {
        position: absolute;
        left: 140px;
        max-width: 860px;
        opacity: 0;
        text-shadow: 0 3px 22px rgba(37, 25, 16, 0.55);
      }
      .eyebrow {
        top: 118px;
        margin: 0;
        color: #e8c99e;
        font-size: 21px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }
      .title {
        top: 164px;
        margin: 0;
        font-size: 74px;
        font-weight: 500;
        line-height: 1.08;
        letter-spacing: 0.02em;
        white-space: pre-line;
      }
      .subtitle {
        top: 358px;
        margin: 0;
        color: #f0dfc4;
        font-size: 27px;
        letter-spacing: 0.04em;
      }
      .ending {
        top: 150px;
        left: 160px;
        max-width: 770px;
        white-space: pre-line;
      }
      .ending p {
        margin: 0;
        color: #fff0d4;
        font-size: 40px;
        line-height: 1.28;
      }
    </style>
  </head>
  <body>
    <main
      id="stage"
      data-composition-id="paper-letter"
      data-start="0"
      data-duration="20"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <canvas id="render-surface" aria-label="Three-dimensional paper diorama"></canvas>
      <div id="titles">
        <p id="eyebrow" class="clip eyebrow" data-start="0.35" data-duration="4.3" data-track-index="4">Một chuyện kể bằng giấy</p>
        <h1 id="title" class="clip title" data-start="0.35" data-duration="4.3" data-track-index="5">Bức thư qua
rừng bông lao</h1>
        <p id="subtitle" class="clip subtitle" data-start="0.35" data-duration="4.3" data-track-index="6">Chuyến đi của An, giữa những ngày trời tối.</p>
        <p id="ending" class="clip ending" data-start="17.4" data-duration="2.6" data-track-index="7">Mong rằng ngày mai,
đèn nhà ai cũng sáng.</p>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
