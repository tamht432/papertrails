    <style>
      html, body { cursor: none; margin: 0; height: 100%; overflow: hidden; background: #1c130d; }
      canvas#atlas { cursor: none; position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
      /* The only on-screen text allowed: a plain fading hint. No panels, no buttons. */
      #hint {
        position: fixed; left: 0; right: 0; bottom: 4.5vh; text-align: center;
        font: 500 13px/1 Georgia, 'Times New Roman', serif; letter-spacing: 0.14em;
        color: rgba(255, 240, 214, 0.78); text-shadow: 0 1px 6px rgba(20, 10, 0, 0.55);
        pointer-events: none; user-select: none; opacity: 0; transition: opacity 1.4s ease;
      }
      #hint.on { opacity: 1; }
      /* Cine mode (?cine=1): same paper serif, a shot line + thin progress rule + one hint line. */
      #cine {
        position: fixed; left: 0; right: 0; bottom: 3vh; text-align: center;
        font: 500 12px/1.6 Georgia, 'Times New Roman', serif; letter-spacing: 0.14em;
        color: rgba(255, 240, 214, 0.8); text-shadow: 0 1px 6px rgba(20, 10, 0, 0.55);
        pointer-events: none; user-select: none; opacity: 0; transition: opacity 1.2s ease;
      }
      #cine.on { opacity: 1; }
      #cine-bar { width: 240px; height: 2px; margin: 6px auto 0; background: rgba(255, 240, 214, 0.16); }
      #cine-bar i { display: block; height: 100%; background: rgba(255, 240, 214, 0.85); transform-origin: 0 50%; transform: scaleX(0); }
      #cine-hint { margin-top: 6px; font-size: 11px; opacity: 0.75; }
    </style>
  </head>
  <body>
    <canvas id="atlas" tabindex="0"></canvas>
    <div id="hint">WASD / click to walk &nbsp;·&nbsp; Shift run &nbsp;·&nbsp; Ctrl slow &nbsp;·&nbsp; Tab map &nbsp;·&nbsp; N night &nbsp;·&nbsp; M music &nbsp;·&nbsp; V view</div>
    <div id="cine">
      <div id="cine-shot"></div>
      <div id="cine-bar"><i id="cine-bar-fill"></i></div>
      <div id="cine-hint"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
